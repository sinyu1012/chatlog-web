name: Local archive validation
on:
  push:
    branches: [main, feat/local-wcdb-archive]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: local-archive-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Core and archive unit tests
        run: node --test tests/*.test.mjs
      - name: Lint source
        run: npm run lint -- --no-fix src
      - name: Build production app
        run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser tooling
        run: |
          python -m pip install playwright==1.52.0 pillow
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Existing HTTP and demo regression
        run: python tests/browser-smoke.py
      - name: Real SQLite local import regression
        run: python tests/browser-local.py
      - name: Verify application source was not changed by tests
        run: git diff --exit-code -- src package.json package-lock.json README.md README_EN.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-archive-evidence
          path: |
            images/ui/
            images/wcdb/
          if-no-files-found: warn
